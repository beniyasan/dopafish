name: FishingPachinko
options:
  bundleIdPrefix: com.devin
  deploymentTarget: "17.0"
targets:
  FishingPachinko:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FishingPachinko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.FishingPachinko
        PRODUCT_NAME: 爆釣パチンコ
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
  FishingPachinkoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FishingPachinkoTests
    dependencies:
      - target: FishingPachinko
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/爆釣パチンコ.app/爆釣パチンコ"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FishingPachinko:
    build:
      targets:
        FishingPachinko: all
    test:
      targets:
        - FishingPachinkoTests
